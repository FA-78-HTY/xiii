<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="하고 싶은 일을 고르면 상황별로 어떤 AI를 쓰면 좋은지 알려주는 안내도">
<title>XIII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: 화면 중앙 한 줄기 — 제목, 키워드 유리 캡슐, 선택 시 유리 패널이 아래로 자라남. 배경은 커서를 따라 흐르는 파스텔 빛 덩어리 */
:root{
  --base:#F7F8FF; --fg:#23264D; --muted:#6B6F94;
  --peri:#9FA1FF; --lav:#B5BAFF; --sky:#AEE2FF; --mint:#D9F9DF;
  --b1:#9FA1FF; --b2:#B5BAFF; --b3:#AEE2FF; --b4:#D9F9DF; --bo:1;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.72);
  --edge-hi:rgba(255,255,255,.95); --edge-lo:rgba(159,161,255,.22);
  --shadow:rgba(110,114,220,.16); --spec:rgba(255,255,255,.75);
  --sel:#9FA1FF; --on-sel:#ffffff; --arrow:#3894c2; --tag-fg:#23264D;
  --spot1:rgba(146,149,250,.3); --spot2:rgba(174,178,255,.12); --core:#9C9FFA; --core-o:.42;
  --font:"IBM Plex Sans KR","IBM Plex Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --base:#070913; --fg:#ECEEFE; --muted:#8F95BD;
  --b1:#5E62DE; --b2:#4A3F9E; --b3:#1E5C80; --b4:#1C5A55; --bo:.75;
  --glass:rgba(22,26,50,.52); --glass-strong:rgba(30,34,64,.66);
  --edge-hi:rgba(255,255,255,.22); --edge-lo:rgba(255,255,255,.05);
  --shadow:rgba(0,0,0,.5); --spec:rgba(200,205,255,.22);
  --sel:#7276E8; --on-sel:#ffffff; --arrow:#6ec5ef; --mint:#1C4D4A; --tag-fg:#A8F2DB; --sky:#2a4a66;
  --spot1:rgba(114,118,232,.2); --spot2:rgba(114,118,232,.07); --core:#6E72E6; --core-o:.32;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --base:#070913; --fg:#ECEEFE; --muted:#8F95BD;
  --b1:#5E62DE; --b2:#4A3F9E; --b3:#1E5C80; --b4:#1C5A55; --bo:.75;
  --glass:rgba(22,26,50,.52); --glass-strong:rgba(30,34,64,.66);
  --edge-hi:rgba(255,255,255,.22); --edge-lo:rgba(255,255,255,.05);
  --shadow:rgba(0,0,0,.5); --spec:rgba(200,205,255,.22);
  --sel:#7276E8; --on-sel:#ffffff; --arrow:#6ec5ef; --mint:#1C4D4A; --tag-fg:#A8F2DB; --sky:#2a4a66;
  --spot1:rgba(114,118,232,.2); --spot2:rgba(114,118,232,.07); --core:#6E72E6; --core-o:.32;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--base);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .4s}

/* 배경 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform;transition:background-color .5s}
.blob.p{width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;background:var(--b1);opacity:calc(.55*var(--bo))}
.blob.l{width:50vmax;height:50vmax;right:-16vmax;top:-4vmax;background:var(--b2);opacity:calc(.5*var(--bo))}
.blob.s{width:40vmax;height:40vmax;left:-6vmax;bottom:-18vmax;background:var(--b3);opacity:calc(.55*var(--bo))}
.blob.m{width:34vmax;height:34vmax;right:-10vmax;bottom:-14vmax;background:var(--b4);opacity:calc(.7*var(--bo))}
.spot{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px circle at var(--gx,50%) var(--gy,35%),var(--spot1),var(--spot2) 38%,transparent 72%)}
.core{position:fixed;z-index:0;pointer-events:none;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:var(--core);filter:blur(70px);opacity:var(--core-o);will-change:transform}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* 리퀴드 글래스 공통 */
.glass{position:relative;background:var(--glass);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.04);-webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.04);
  box-shadow:inset 0 1.5px 0 0 var(--edge-hi),inset 0 -1px 0 0 var(--edge-lo),inset 0 0 18px rgba(255,255,255,.08),0 10px 30px -10px var(--shadow);
  isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,var(--edge-hi),transparent 38%,transparent 62%,var(--edge-lo));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(180px circle at var(--lx,50%) var(--ly,0%),var(--spec),transparent 65%)}
.glass:hover::after,.panel.glass::after{opacity:1}

/* 테마 토글 */
.toggle{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 20px);right:20px;border:none;border-radius:999px;padding:4px;display:flex;gap:2px;cursor:pointer;font:inherit;color:var(--muted)}
.toggle span{position:relative;z-index:1;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;transition:color .3s}
.toggle .thumb{position:absolute;z-index:0;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:var(--glass-strong);box-shadow:0 2px 8px var(--shadow),inset 0 1px 0 var(--edge-hi);transition:transform .35s cubic-bezier(.16,1,.3,1)}
.toggle[aria-checked="true"] .thumb{transform:translateX(32px);background:var(--sel)}
.toggle[aria-checked="true"] .moon,.toggle[aria-checked="false"] .sun{color:var(--fg)}
.toggle[aria-checked="true"] .moon{color:#fff}
.toggle svg{width:16px;height:16px}
.toggle:focus-visible{outline:2px solid var(--sel);outline-offset:3px}

/* 본문 */
main{position:relative;z-index:1;min-height:100%;display:flex;justify-content:center;padding-inline:20px;padding-block:72px 56px}
.spine{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;transition:padding-top .6s cubic-bezier(.16,1,.3,1)}
body:not(.picked) .spine{padding-top:max(0px,calc(50vh - 220px))}
h1{margin:0;font-weight:600;font-size:clamp(40px,6vw,56px);line-height:1.1;letter-spacing:.12em;padding-left:.12em;text-align:center;text-wrap:balance}
.ask{margin:8px 0 0;font-weight:300;font-size:18px;color:var(--muted);text-align:center}
.search{display:flex;align-items:center;gap:10px;width:100%;max-width:440px;margin-top:28px;border-radius:999px;padding:0 18px;color:var(--muted);cursor:text}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:300;color:var(--fg);background:none;border:none;padding:13px 0;outline:none}
.search input::placeholder{color:var(--muted);opacity:.85}
.search:focus-within{box-shadow:inset 0 1.5px 0 0 var(--edge-hi),0 0 0 2px var(--sel),0 10px 30px -10px var(--shadow)}
.search input::-webkit-search-cancel-button{opacity:.5}
.nomatch{margin:10px 0 0;font-size:13px;font-weight:300;color:var(--muted)}
.pill.dim{opacity:.35}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 8px;margin-top:20px;max-width:680px}
.pill{font:inherit;font-size:15px;font-weight:400;color:var(--fg);border:none;border-radius:999px;padding:8px 16px;cursor:pointer;
  transition:transform .35s cubic-bezier(.16,1,.3,1),background-color .25s,color .25s,box-shadow .3s}
.pill:hover{transform:translateY(-1px)}
.pill:active{transform:scale(.96)}
.pill:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.pill[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);font-weight:600;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(60,60,160,.18),0 6px 22px -4px var(--sel);animation:jelly .5s cubic-bezier(.16,1,.3,1)}
@keyframes jelly{0%{transform:scale(1)}35%{transform:scale(1.12,.92)}65%{transform:scale(.97,1.04)}100%{transform:scale(1)}}

.panel{width:100%;margin-top:40px;border-radius:24px;padding:12px 22px;transform-origin:top center}
.panel[hidden]{display:none!important}
.panel.enter{animation:grow .55s cubic-bezier(.16,1,.3,1)}
@keyframes grow{from{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.row{border-bottom:1px solid var(--edge-lo)}
.row:last-child{border-bottom:none}
.row-h{width:100%;font:inherit;color:inherit;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 6px;text-align:left;border-radius:12px;transition:background-color .2s}
.row-h:hover{background:rgba(181,186,255,.12)}
.row-h:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.sit{display:flex;align-items:center;gap:10px;font-weight:300;font-size:16px;color:var(--muted);min-width:0;transition:color .2s}
.row-h:hover .sit,.row.open .sit{color:var(--fg)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sel);opacity:0;transition:opacity .2s;flex:none}
.row.open .dot{opacity:1}
.ai{display:flex;align-items:center;gap:10px;flex:none}
.ai b{font-weight:600;font-size:17px;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:600;background:var(--mint);color:var(--tag-fg);padding:3px 7px;border-radius:6px;line-height:1}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.row.open .chev{transform:rotate(180deg)}
.row-b{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .35s cubic-bezier(.16,1,.3,1),opacity .3s}
.row.open .row-b{grid-template-rows:1fr;opacity:1}
.row-b>div{overflow:hidden}
.row-b .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:0 6px 18px 22px}
.row-b p{margin:0;font-weight:300;font-size:13.5px;color:var(--muted);line-height:1.6;flex:1 1 220px;min-width:0}
.go{font-size:13px;font-weight:400;color:var(--fg);text-decoration:none;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--sky) 55%,transparent);display:inline-flex;gap:6px;align-items:center;transition:background-color .2s}
.go:hover{background:var(--sky)}
.go:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.flow{margin:26px 0 0;font-size:13px;font-weight:300;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;text-align:center}
.flow b{font-weight:400;color:var(--fg)}
.flow i{font-style:normal;font-weight:600;color:var(--arrow)}
@media (max-width:520px){
  .pill{font-size:14px;padding:7px 13px}
  .panel{padding:6px 14px}
  .sit{font-size:15px}.ai b{font-size:16px}
  .row-b .in{padding-left:16px}
}
/* 작은 창(사이드 위젯) 모드: 폭이 좁으면 자동 적용 */
@media (max-width:440px){
  main{padding-inline:14px;padding-block:18px 28px}
  body:not(.picked) .spine,.spine{padding-top:0}
  .spine{align-items:stretch}
  h1{font-size:26px;text-align:left;letter-spacing:.1em;padding-left:0;padding-right:96px;line-height:38px}
  .ask{display:none}
  .toggle{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;transform:scale(.88);transform-origin:top right}
  .search{max-width:none;margin-top:14px;padding:0 14px}
  .search input{padding:10px 0;font-size:14px}
  .pills{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;margin:12px -14px 0;padding:4px 14px 8px;scrollbar-width:none;max-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:none;font-size:13px;padding:6px 12px}
  .panel{margin-top:10px;border-radius:18px;padding:2px 12px}
  .row-h{padding:13px 2px}
  .sit{font-size:14px;gap:8px}.ai b{font-size:15px}.ai{gap:6px}
  .row-b .in{padding:0 2px 13px 14px}
  .flow{margin-top:14px;font-size:12px;justify-content:flex-start;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main>
  <div class="spine">

    <p class="ask">무엇을 도와드릴까요?</p>

    <section class="panel glass" id="panel" hidden aria-live="polite"><div id="rows"></div></section>

 ["음성·음악",[["나레이션","elevenlabs","한국어 음성이 자연스러워요"],["영상 더빙","elevenlabs","원래 목소리 느낌을 유지해요"],["노래·배경음악","suno","보컬까지 들어간 완성곡을 만들어요"]],null],
 ["강의·회의 정리",[["한국어 받아쓰기","clova","한국어 정확도가 높고 화자를 구분해요"],["요약·할 일 정리","claude","결정 사항과 할 일을 뽑아줘요"],["구글 Meet 회의","gemini","Meet 안에서 바로 요약해요"]],["clova","claude"]],
 ["발표자료",[["내용·흐름 짜기","claude","슬라이드별 핵심 문장과 순서를 잡아줘요"],["대본·예상 질문","chatgpt","질문 리스트와 답변 연습에 좋아요"],["구글 Slides 초안","gemini","Slides 안에서 바로 초안을 만들어요"]],null]
];
const SYN=[
 "글 글쓰기 리포트 레포트 과제 보고서 자소서 자기소개서 에세이 기획서 작문 초안 블로그",
 "조사 자료 검색 찾기 출처 팩트 사실 최신 뉴스 시장 논문찾기 근거 리서치",
 "공부 시험 편입 학습 암기 요약 교재 강의자료 문제 퀴즈 개념 복습 자격증 기출",
 "번역 영어 영문 일본어 중국어 외국어 해석 논문번역 메일",
 "코딩 코드 개발 프로그램 앱 웹 사이트 버그 에러 디버깅 파이썬 자바 프로젝트 게임",
 "iot 아두이노 라즈베리파이 센서 회로 하드웨어 임베디드 펌웨어 데이터시트 보드",
 "이미지 그림 일러스트 썸네일 포스터 로고 캐릭터 그리기 사진생성",
 "사진 편집 보정 배경 합성 지우기 수정 누끼",
 "영상 동영상 비디오 유튜브 쇼츠 릴스 숏폼 틱톡 애니메이션",
 "음성 목소리 나레이션 더빙 tts 음악 노래 bgm 배경음악 작곡",
 "회의 회의록 강의 녹음 받아쓰기 정리 팀플 수업 메모",
 "발표 ppt 피피티 슬라이드 프레젠테이션 발표자료 대본"
];
const $=s=>document.querySelector(s);
const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
let cur=-1;
$("#pills").innerHTML=K.map((k,i)=>`<button class="pill glass" id="pill-${i}" data-i="${i}" aria-pressed="false">${k[0]}</button>`).join("");
function pick(i){
  cur=i;document.body.classList.add("picked");
  document.querySelectorAll(".pill").forEach(p=>p.setAttribute("aria-pressed",+p.dataset.i===i));
  const [,cases,flow]=K[i];
  $("#rows").innerHTML=cases.map((c,j)=>`<div class="row${j===0?" open":""}">
    <button class="row-h" aria-expanded="${j===0}"><span class="sit"><i class="dot"></i>${c[0]}</span>
    <span class="ai"><b>${T[c[1]][0]}</b>${j===0?'<span class="tag">추천</span>':""}${chev}</span></button>
    <div class="row-b"><div><div class="in"><p>${c[2]}</p><a class="go" href="${T[c[1]][1]}" target="_blank" rel="noopener">사이트 열기 <span>↗</span></a></div></div></div></div>`).join("");
  const panel=$("#panel");panel.hidden=false;panel.classList.remove("enter");void panel.offsetWidth;panel.classList.add("enter");
  const f=$("#flow");
  if(flow){f.innerHTML=`<span>추천 순서</span>`+flow.map(id=>`<b>${T[id][0]}</b>`).join("<i>→</i>");f.hidden=false}else f.hidden=true;
  try{localStorage.setItem("need",i)}catch(e){}
}
$("#pills").addEventListener("click",e=>{const b=e.target.closest(".pill");if(b)pick(+b.dataset.i)});
function scores(q){
  const ws=q.toLowerCase().split(/\s+/).map(w=>w.replace(/(하고싶어|하고 싶어|해줘|하기|할래|하려고|해야해|해야|싶어|만들기)$/,"")).filter(w=>w.length>=2||w==="글");
  return K.map((k,i)=>{const hay=(k[0]+" "+SYN[i]+" "+k[1].map(c=>c[0]).join(" ")).toLowerCase();
    let s=0;ws.forEach(w=>{if(hay.includes(w))s+=2;else if(w.length>=2&&SYN[i].split(" ").some(t=>t.length>=2&&w.includes(t)))s+=1});return s});
}
const q=$("#q");
q.addEventListener("input",()=>{
  const v=q.value.trim();const pills=document.querySelectorAll(".pill");
  if(!v){pills.forEach(p=>p.classList.remove("dim"));$("#nomatch").hidden=true;return}
  const sc=scores(v),max=Math.max(...sc);
  pills.forEach((p,i)=>p.classList.toggle("dim",sc[i]===0));
  $("#nomatch").hidden=max>0;
  if(max>0){const best=sc.indexOf(max);if(best!==cur)pick(best)}
});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";q.dispatchEvent(new Event("input"))}});
$("#rows").addEventListener("click",e=>{const h=e.target.closest(".row-h");if(!h)return;const row=h.parentElement,open=!row.classList.contains("open");
  document.querySelectorAll(".row").forEach(r=>{r.classList.remove("open");r.querySelector(".row-h").setAttribute("aria-expanded","false")});
  if(open){row.classList.add("open");h.setAttribute("aria-expanded","true")}});

/* 테마 */
const tg=$("#theme"),root=document.documentElement;
function isDark(){const t=root.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function syncTg(){tg.setAttribute("aria-checked",isDark())}
tg.addEventListener("click",()=>{root.setAttribute("data-theme",isDark()?"light":"dark");syncTg()});
syncTg();

/* 배경 + 유리 반사광 */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const blobs=[...document.querySelectorAll(".blob")],k=[[1,1,.045],[-.7,-.7,.03],[.5,-.5,.025],[-.4,.4,.035]];
const pos=blobs.map(()=>[0,0]);let tx=0,ty=0,gx=innerWidth/2,gy=innerHeight*.35,mx=gx,my=gy;
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;tx=(mx-innerWidth/2)*.22;ty=(my-innerHeight/2)*.22;
  const el=e.target.closest&&e.target.closest(".glass");
  document.querySelectorAll(".glass").forEach(g=>{const r=g.getBoundingClientRect();g.style.setProperty("--lx",(mx-r.left)+"px");g.style.setProperty("--ly",(my-r.top)+"px")});
},{passive:true});
const spot=$(".spot"),core=$(".core");let cx=gx,cy=gy;
core.style.transform=`translate3d(${cx}px,${cy}px,0)`;
function tick(t){
  const s=t/1000;
  blobs.forEach((b,i)=>{const d=[Math.sin(s*.15+i*1.7)*40,Math.cos(s*.12+i*2.1)*34];
    pos[i][0]+=(tx*k[i][0]+d[0]-pos[i][0])*k[i][2];pos[i][1]+=(ty*k[i][1]+d[1]-pos[i][1])*k[i][2];
    b.style.transform=`translate3d(${pos[i][0].toFixed(1)}px,${pos[i][1].toFixed(1)}px,0)`});
  gx+=(mx-gx)*.08;gy+=(my-gy)*.08;spot.style.setProperty("--gx",gx+"px");spot.style.setProperty("--gy",gy+"px");
  cx+=(mx-cx)*.05;cy+=(my-cy)*.05;core.style.transform=`translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`;
  requestAnimationFrame(tick);
}
if(!reduce)requestAnimationFrame(tick);

try{const s=localStorage.getItem("need");if(s!==null&&K[+s])pick(+s)}catch(e){}
</script>

</body>
</html>
